# Render Blueprint — deploys backend + frontend in one click.
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy steps:
#   1. Push this repo to GitHub.
#   2. Go to https://dashboard.render.com → New → Blueprint.
#   3. Connect the repo — Render will detect this file automatically.
#   4. Set the two marked env vars (GEMINI_API_KEY, CORS_ORIGINS / VITE_API_BASE_URL)
#      in the Render dashboard after the first deploy.

services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: skillbridge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set this manually in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./skillbridge.db
      - key: CORS_ORIGINS
        sync: false          # set to your frontend URL, e.g. https://skillbridge-frontend.onrender.com

  # ── Frontend (React / Vite static site) ───────────────────────────────────
  - type: static
    name: skillbridge-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # set to https://skillbridge-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
